# Weekly backup of the database (and the photos), ENCRYPTED before it is stored – this
# repository is public, so nothing readable may be uploaded. Restore: docs/backup-restore.md.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_PASSPHRASE          long passphrase that encrypts the backups – keep a copy safe!
#   SUPABASE_SERVICE_ROLE_KEY  reads all tables, login accounts and photos (server-side only)
name: Weekly backup

on:
  schedule:
    - cron: '30 18 * * 0' # Sunday 18:30 UTC = Monday 00:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SERVICE_KEY" ] || [ -z "$PASS" ]; then
            echo "::error::Set SUPABASE_SERVICE_ROLE_KEY and BACKUP_PASSPHRASE (see docs/backup-restore.md)."
            exit 1
          fi

      - name: Export all tables and login accounts
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/backup-db.mjs db
          # The database structure, so a restore has everything in one file.
          cp -r supabase/migrations db/migrations

      - name: Encrypt
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          tar -czf "fitcoach-db-$STAMP.tar.gz" db
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0             --symmetric --cipher-algo AES256 -o "fitcoach-db-$STAMP.tar.gz.gpg" "fitcoach-db-$STAMP.tar.gz"
          rm -rf db "fitcoach-db-$STAMP.tar.gz"
          ls -la fitcoach-db-*.gpg

      - uses: actions/upload-artifact@v5
        with:
          name: fitcoach-db-${{ env.STAMP }}
          path: fitcoach-db-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download photos
        id: download
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "No SUPABASE_SERVICE_ROLE_KEY – skipping the photo backup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/backup-photos.mjs photos

      - name: Encrypt
        if: steps.download.outputs.skip != 'true'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          tar -czf "fitcoach-photos-$STAMP.tar.gz" photos
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "fitcoach-photos-$STAMP.tar.gz.gpg" "fitcoach-photos-$STAMP.tar.gz"
          rm -rf photos "fitcoach-photos-$STAMP.tar.gz"

      - uses: actions/upload-artifact@v5
        if: steps.download.outputs.skip != 'true'
        with:
          name: fitcoach-photos-${{ env.STAMP }}
          path: fitcoach-photos-*.tar.gz.gpg
          retention-days: 35
          if-no-files-found: error
