# Daily request to the database so the free Supabase project never pauses for inactivity.
# Uses only public values (the project URL and publishable key, as repository variables).
name: Keep database awake

on:
  schedule:
    - cron: '17 3 * * *' # every day 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            if [ "$code" = "200" ]; then echo "Database answered: $(cat /tmp/out)"; exit 0; fi
            echo "Attempt $attempt: HTTP $code"; sleep 20
          done
          echo "::error::Database did not answer – check the Supabase dashboard (it may be paused)."
          exit 1
