# Builds the signed Android APK on GitHub's servers (no Android Studio needed locally).
# Run it from GitHub → Actions → "Android APK" → Run workflow, or push a tag like android-v1.0.
#
# Needs (Settings → Secrets and variables → Actions):
#   secrets   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD   (scripts/create-android-keystore.ps1)
#   variables VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# Optional, to send the APK to testers with Firebase App Distribution:
#   secrets   FIREBASE_SERVICE_ACCOUNT_JSON   variables FIREBASE_ANDROID_APP_ID, FIREBASE_TESTER_GROUPS
name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: What changed (shown to testers)
        required: false
        default: ''
  push:
    tags: ['android-v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Copy web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version name
        run: echo "ANDROID_VERSION_NAME=$(node -p "require('./package.json').version").${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing – run scripts/create-android-keystore.ps1"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: fitcoach
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/FitCoach-$ANDROID_VERSION_NAME.apk"

      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/FitCoach-$ANDROID_VERSION_NAME.apk" | head -3

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: FitCoach-${{ env.ANDROID_VERSION_NAME }}
          path: ${{ runner.temp }}/FitCoach-${{ env.ANDROID_VERSION_NAME }}.apk
          retention-days: 30

      - name: Send to testers (Firebase App Distribution)
        if: ${{ vars.FIREBASE_ANDROID_APP_ID != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@latest appdistribution:distribute \
            "$RUNNER_TEMP/FitCoach-$ANDROID_VERSION_NAME.apk" \
            --app "${{ vars.FIREBASE_ANDROID_APP_ID }}" \
            --groups "${{ vars.FIREBASE_TESTER_GROUPS || 'friends' }}" \
            --release-notes "${NOTES:-FitCoach $ANDROID_VERSION_NAME}"
          rm -f "$RUNNER_TEMP/firebase-sa.json"
